# PR과 develop·main에 올라올 때마다 테스트를 돌린다. 앱이 Windows 데스크톱용이라 Windows에서,
# 지원 범위의 양 끝(최소 3.11, 개발에 쓰는 3.14)에서 확인한다.
name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:   # Actions 화면에서 다시 돌리기(예: 간접 의존성이 바뀐 뒤 재확인)

permissions:
  contents: read   # 코드를 읽기만 한다

concurrency:
  group: tests-${{ github.ref }}
  # PR에 연달아 push할 때만 앞 실행을 취소한다. develop·main의 병합 커밋은 하나도 빠짐없이 끝까지 검사.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: windows-2025   # 이미지 버전 고정(windows-latest는 바뀔 수 있음)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen   # 화면 없이 Qt 위젯 테스트
      PYTHONIOENCODING: utf-8
    steps:
      # 외부 액션은 태그 대신 커밋 해시로 고정(태그가 바뀌어도 리뷰한 코드만 실행)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      # 아이콘(.ico) 테스트용. 한 버전에서만 받는다(requirements-build의 PyInstaller까지는 필요 없음).
      - if: matrix.python-version == '3.14'
        run: python -m pip install pillow==12.3.0
      - run: python -m pytest -q -rs   # -rs: 건너뛴 테스트와 이유를 로그에 남긴다
