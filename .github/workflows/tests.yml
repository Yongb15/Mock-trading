# PR과 develop·main에 올라올 때마다 테스트를 돌린다. 앱이 Windows 데스크톱용이라 Windows에서,
# 지원 범위의 양 끝(최소 3.11, 개발에 쓰는 3.14)에서 확인한다.
name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:   # Actions 화면에서 다시 돌리기(예: 간접 의존성이 바뀐 뒤 재확인)

permissions:
  contents: read   # 코드를 읽기만 한다

# PR은 ref별로 묶어 연달아 push하면 앞 실행을 취소한다. develop·main push와 수동 실행은 커밋(sha)별 그룹이라
# 대기 중인 실행이 다음 실행에 밀려 취소되는 일도 없다(같은 그룹의 '대기'는 cancel-in-progress와 무관하게 취소됨).
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    # 이름은 브랜치 보호의 필수 검사("pytest (3.11)", "pytest (3.14)")와 같아야 한다
    name: pytest (${{ matrix.python-version }})
    runs-on: windows-2025   # 이미지 버전 고정(windows-latest는 바뀔 수 있음)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 간접 의존성까지 해시로 고정한 lock으로 설치한다(packaging/lock.py). 3.14는 릴리스 빌드와 같은 lock
          # (앱 + 빌드 도구, 아이콘 테스트용 pillow 포함)이라 CI가 배포물과 같은 버전을 검사한다.
          - python-version: "3.11"
            lock: requirements-py311.lock
          - python-version: "3.14"
            lock: requirements-build.lock
    env:
      QT_QPA_PLATFORM: offscreen   # 화면 없이 Qt 위젯 테스트
      PYTHONIOENCODING: utf-8
    steps:
      # 외부 액션은 태그 대신 커밋 해시로 고정(태그가 바뀌어도 리뷰한 코드만 실행)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      # --require-hashes: 받은 파일이 lock의 SHA-256과 다르면 설치를 멈춘다(바꿔치기된 패키지 차단)
      - run: python -m pip install --require-hashes -r ${{ matrix.lock }}
      - run: python -m pytest -q -rs   # -rs: 건너뛴 테스트와 이유를 로그에 남긴다
